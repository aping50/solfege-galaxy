@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0d26}}
:root[data-theme="dark"]{--bg:#0b0d26}
html,body{height:100%;margin:0;background:var(--bg);color-scheme:dark}
body::before{content:"";position:fixed;inset:-40px;background:var(--img) center/cover;filter:blur(26px) brightness(.35)}
#wrap{position:fixed;inset:0;display:flex;overflow:auto}
#stage{position:relative;flex:none;margin:auto;width:max(min(100vw,179.17vh),820px);aspect-ratio:1376/768;container-type:inline-size;box-shadow:0 0 60px rgba(0,0,0,.55)}
.base{position:absolute;inset:0;background:var(--img) center/100% 100%}
.shade{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,rgba(3,4,16,.55) 0%,rgba(3,4,16,.74) 60%,rgba(3,4,16,.88) 100%)}
.wm{position:absolute;left:0;right:0;bottom:3.2%;text-align:center;pointer-events:none;font:600 20px "Noto Serif TC",serif;font-size:max(13px,2.7cqw);letter-spacing:.38em;text-indent:.38em;color:var(--gold);opacity:.55;text-shadow:0 0 12px rgba(255,200,120,.55),0 0 3px #000}
.spot{position:absolute;display:block;cursor:pointer;background:none;border:0;padding:0;color:inherit;font:inherit;-webkit-tap-highlight-color:transparent;text-decoration:none}
.spot:hover,.spot:focus-visible{z-index:5}
.spot:focus-visible{outline:2px solid #fff;outline-offset:4px;border-radius:12px}
.lens{position:absolute;background-image:var(--img);background-repeat:no-repeat;opacity:1;transform:scale(1);transition:opacity .12s,transform .3s cubic-bezier(.2,.9,.3,1.2),filter .3s;pointer-events:none;-webkit-mask-composite:source-in;mask-composite:intersect}
.glow{position:absolute;inset:-30%;background:radial-gradient(closest-side,rgba(255,222,150,.38),transparent);opacity:0;transition:opacity .3s;pointer-events:none}
.dim .lens{opacity:0}
.boost .lens{filter:brightness(1.3) saturate(1.2) drop-shadow(0 0 6px rgba(255,222,150,.6))}
.boost .glow{opacity:.65;inset:-45%;animation:pulse 3.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:.85}}
.spot.boost:hover .lens{filter:brightness(1.4) saturate(1.25) drop-shadow(0 0 8px rgba(255,222,150,.8))}
.spot.boost:hover .glow{opacity:1;animation:none}
.spot:hover .lens,.spot:focus-visible .lens{opacity:1;transform:scale(1.17);filter:brightness(1.15) saturate(1.1)}
.spot:hover .glow,.spot:focus-visible .glow{opacity:1}
.nm,.tip{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;pointer-events:none}
.nm{top:100%;margin-top:2px;font:500 max(12px,2.2cqw) "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;letter-spacing:.06em;color:#ecd6b4;text-shadow:0 1px 3px rgba(20,14,40,.85),0 0 10px rgba(20,14,40,.55)}
.tip{top:100%;margin-top:6px;font-size:clamp(11px,1.2vw,15px);padding:3px 12px;border-radius:99px;background:var(--pill);color:var(--pill-ink);border:1px solid rgba(246,223,176,.45);opacity:0;transition:opacity .2s}
.spot:hover .tip,.spot:focus-visible .tip{opacity:1}
#hint{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-size:12px;color:var(--gold);opacity:.8;pointer-events:none;text-shadow:0 0 6px #000;font-family:system-ui,"PingFang TC","Microsoft JhengHei",sans-serif}
#toast{position:fixed;left:50%;bottom:calc(40px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--toast);color:var(--toast-ink);padding:9px 18px;border-radius:99px;font:14px system-ui,"PingFang TC","Microsoft JhengHei",sans-serif;opacity:0;transition:.25s;pointer-events:none;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>

<body>
<div id="wrap"><div id="stage" role="group" aria-label="聽寫星球"><div class="base"></div><div class="shade"></div><div class="wm">✦ 音樂基礎訓練星系 ✦</div></div></div>
<div id="hint">點選星球即可前往・滑鼠移過會放大</div>
<div id="toast"></div>
<script>
/* ===== 星球清單 =====
   box = [x, y, 寬, 高]（以原圖 1376×768 為座標）
   baked:true 表示名稱已畫在圖上；之後要啟用空星球，只要填 name 與 url 即可 */
const SPOTS = [
  { name: "非調性偵測衛星", url: "https://aping50.github.io/116-sightsinging/", box: [525, 38, 325, 190], baked: true },
  { name: "和弦性質星球",   url: "https://aping50.github.io/chordquality/",     box: [460, 290, 202, 185], baked: true },
  { name: "低音與級數星球", url: "https://aping50.github.io/choralestudent/",   box: [745, 245, 510, 370], baked: true },
  { name: "單旋律星球",     url: "https://aping50.github.io/findingwrongnotes/", box: [172, 467, 200, 203], baked: true },
  { name: "", url: "", box: [83, 60, 54, 52] },     /* 預留星球 A（左上小月亮） */
  { name: "節奏星球", url: "https://aping50.github.io/rhythm/", box: [1140, 575, 170, 93], boost: true }   /* 右下小環星 */
];
/* ================== */
const IW = 1376, IH = 768, M = 64;
const stage = document.getElementById('stage'), toast = document.getElementById('toast');
let tt;
function say(m){ toast.textContent = m; toast.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove('show'), 1900); }
const pc = (a, b) => (a / b * 100) + '%';

SPOTS.forEach((s, i) => {
  const [x, y, w, h] = s.box, url = (s.url || '').trim(), name = (s.name || '').trim();
  const el = document.createElement(url ? 'a' : 'button');
  el.className = 'spot' + (!url && !name ? ' dim' : '') + (s.boost ? ' boost' : '');
  if (url) { el.href = url; el.target = '_blank'; el.rel = 'noopener'; }
  else el.addEventListener('click', () => say(name ? '「' + name + '」還沒開放，敬請期待 ✦' : '這顆星球還沒開放，敬請期待 ✦'));
  el.setAttribute('aria-label', name || '預留星球');
  Object.assign(el.style, { left: pc(x, IW), top: pc(y, IH), width: pc(w, IW), height: pc(h, IH), zIndex: i >= 4 ? 2 : 1 });

  const ml = Math.min(M, x), mt = Math.min(M, y), mr = Math.min(M, IW - x - w), mb = Math.min(M, IH - y - h);
  const lx = x - ml, ly = y - mt, lw = w + ml + mr, lh = h + mt + mb;
  const lens = document.createElement('div'); lens.className = 'lens';
  Object.assign(lens.style, { left: pc(-ml, w), top: pc(-mt, h), width: pc(lw, w), height: pc(lh, h),
    backgroundSize: (IW / lw * 100) + '% ' + (IH / lh * 100) + '%',
    backgroundPosition: (lx / (IW - lw) * 100) + '% ' + (ly / (IH - lh) * 100) + '%' });
  const p = v => v / lw * 100, q = v => v / lh * 100;
  const mask = 'linear-gradient(to right,transparent,#000 ' + p(ml) + '%,#000 ' + (100 - p(mr)) + '%,transparent),linear-gradient(to bottom,transparent,#000 ' + q(mt) + '%,#000 ' + (100 - q(mb)) + '%,transparent)';
  lens.style.webkitMaskImage = lens.style.maskImage = mask;

  const glow = document.createElement('div'); glow.className = 'glow';
  el.append(glow, lens);
  if (name && !s.baked) { const n = document.createElement('span'); n.className = 'nm'; n.textContent = name; el.append(n); }
  if (!url) { const t = document.createElement('span'); t.className = 'tip'; t.textContent = '敬請期待 ✦'; el.append(t); }
  stage.append(el);
});
</script>
